id = "herdr-synchronize-input"
name = "Herdr Synchronize Input"
version = "0.1.0"
min_herdr_version = "0.7.4"
description = "Mirror what you type in the focused pane to every other pane in the same tab, by watching pane output (tmux synchronize-panes, output-watching flavor)."
platforms = ["macos", "linux"]

# Pure Node.js, stdlib only — no build step. Requires a Node.js runtime on
# PATH; herdr does not install one.
#
# Bound to a key in the user's config.toml (e.g. prefix+shift+y). Firing it once
# starts a background watcher that mirrors your keystrokes to the other panes in
# the focused tab; firing it again stops the watcher.
[[actions]]
id = "toggle"
title = "Synchronize input to all panes"
contexts = ["workspace"]
command = ["node", "sync-input.js", "toggle"]

# Broadcast control keys. Output-watching can't detect a control key (it leaves
# no trace on the input line and herdr has no key-input hook), so each is an
# explicit action a user binds to a key. When sync is ON they go to every pane
# in the focused tab; when OFF, only to the focused pane (safe to bind directly
# over the real key). See README "Broadcasting control keys".
[[actions]]
id = "send-ctrl-l"
title = "Broadcast Ctrl+L (clear screen)"
contexts = ["workspace"]
command = ["node", "sync-input.js", "send", "ctrl+l"]

[[actions]]
id = "send-ctrl-c"
title = "Broadcast Ctrl+C (interrupt)"
contexts = ["workspace"]
command = ["node", "sync-input.js", "send", "ctrl+c"]

[[actions]]
id = "send-ctrl-d"
title = "Broadcast Ctrl+D (EOF)"
contexts = ["workspace"]
command = ["node", "sync-input.js", "send", "ctrl+d"]

[[actions]]
id = "send-ctrl-w"
title = "Broadcast Ctrl+W (delete word)"
contexts = ["workspace"]
command = ["node", "sync-input.js", "send", "ctrl+w"]

[[actions]]
id = "send-ctrl-b"
title = "Broadcast Ctrl+B (e.g. tmux prefix)"
contexts = ["workspace"]
command = ["node", "sync-input.js", "send", "ctrl+b"]
