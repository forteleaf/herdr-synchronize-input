id = "herdr-synchronize-input"
name = "Herdr Synchronize Input"
version = "0.1.0"
min_herdr_version = "0.7.4"
description = "Mirror what you type in the focused pane to every other pane in the same tab, by watching pane output (tmux synchronize-panes, output-watching flavor)."
platforms = ["macos", "linux"]

# Pure Node.js, stdlib only — no build step. Requires a Node.js runtime on
# PATH; herdr does not install one.
#
# Bound to a key in the user's config.toml (e.g. prefix+shift+y). Firing it once
# starts a background watcher that mirrors your keystrokes to the other panes in
# the focused tab; firing it again stops the watcher.
[[actions]]
id = "toggle"
title = "Synchronize input to all panes"
contexts = ["workspace"]
command = ["node", "sync-input.js", "toggle"]
